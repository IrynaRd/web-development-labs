<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab_3</title>

    <link rel="stylesheet" href="css/styles.css">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css"
        integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous" />
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/js/bootstrap.min.js"
        integrity="sha384-oesi62hOLfzrys4LxRF63OJCXdXDipiYWBnvTl9Y9/TRlw5xlKIEHpNyvvDShgf/"
        crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/uuid/8.2.0/uuid.min.js"></script>


</head>

<body>
    <header class="navbar navbar-expand-lg navbar-light bg-light px-3 header">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#">My Library</a>

            <div class="d-flex">
                <button id="books_page" class="btn btn-outline-primary me-2">Books</button>
                <button id="create" class="btn btn-outline-success">Create Book</button>
            </div>

            <div class="search__menu d-flex ms-auto">
                <input type="text" id="searchInput" class="form-control me-2" placeholder="Type something...">
                <button id="search" class="btn btn-primary me-2">Search</button>
                <button id="reset__search" class="btn btn-danger">Clear</button>
            </div>
        </div>
    </header>

    <div class="container-fluid mt-3">
        <div class="row">
            <aside id="manageBooks" class="col-3 border-end pe-4">
                <h5 class="fw-bold mb-3">Manage books</h5>

                <select id="sort" class="form-select w-auto">
                    <option value="">Sort for:</option>
                    <option value="price">price</option>
                    <option value="pages">pages</option>
                </select>

                <div class="mb-3">
                    <strong>Total price:</strong> <span id="total_expences">0</span>$<br>
                    <button id="count" class="btn btn-primary w-100">Count</button>
                    <p id="total" class="mt-2 fw-bold text-success"></p>
                </div>
            </aside>

            <section id="formSection" class="container mt-4">
                <h2 id="formTitle" class="text-center mb-4">Create Book</h2>

                <div class="form__container">

                    <form id="add_form" class="bg-light">
                        <div class="mb-3">
                            <label for="exampleInputEmail1" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title_input" placeholder="Text..." />
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Author</label>
                            <input type="text" class="form-control" id="author_input" />
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Price($)</label>
                            <input type="number" id="price_input" class="form-control" step="10.0" min="0" />
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Pages</label>
                            <input type="number" class="form-control" id="pages_input" step="1.0" min="0" />
                        </div>
                        <div class="mb-3">
                            <label for="exampleInputPassword1" class="form-label">Description</label>
                            <input type="text" class="form-control" id="description_input" placeholder="Text..." />
                        </div>
                        <button id="submit_button" type="submit" class="btn btn-primary">
                            Submit
                        </button>
                    </form>
                </div>
            </section>

            <main class="col-9">
                <div id="bookList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

                </div>
            </main>
        </div>
    </div>

    <div id="modal" class="modal" style="display:none;">
        <div class="modal__content">
            <span id="close_modal" class="close">&times;</span>
            <p id="modal_message"></p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
